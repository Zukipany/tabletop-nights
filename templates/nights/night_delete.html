{% extends 'base.html' %}
{% block title %}Cancel {{ night.title }}{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card p-4 border-danger">
                <h1 class="h3 text-danger">Cancel “{{ night.title }}”?</h1>
                <p>The game night will be deleted for everyone. This cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    {% include 'partials/form_fields.html' %}
                    <button type="submit" class="btn btn-danger">Yes, cancel it</button>
                    <a href="{{ night.get_absolute_url }}" class="btn btn-link">Keep it</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

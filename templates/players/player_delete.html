{% extends 'base.html' %}
{% block title %}Delete {{ player.nickname }}{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card p-4 border-danger">
                <h1 class="h3 text-danger">Delete {{ player.nickname }}?</h1>
                <p>The player will be removed from all game nights. This cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    {% include 'partials/form_fields.html' %}
                    <button type="submit" class="btn btn-danger">Yes, delete</button>
                    <a href="{{ player.get_absolute_url }}" class="btn btn-link">Cancel</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

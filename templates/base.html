<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TableTop Nights{% endblock %} · TableTop Nights</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --tt-accent: #7c3aed; --tt-bg: #f6f4fb; }
        body { background: var(--tt-bg); min-height: 100vh; display: flex; flex-direction: column; }
        main { flex: 1; }
        .navbar { background: linear-gradient(90deg, #4c1d95, #7c3aed); }
        .btn-accent { background: var(--tt-accent); color: #fff; }
        .btn-accent:hover { background: #6d28d9; color: #fff; }
        .card { border: 0; border-radius: 1rem; box-shadow: 0 4px 18px rgba(76, 29, 149, .08); }
        .card-hover:hover { transform: translateY(-3px); transition: .2s; }
        .hero { background: linear-gradient(135deg, #ede9fe, #fff); border-radius: 1.5rem; }
        .stat { font-size: 2rem; font-weight: 700; color: var(--tt-accent); }
        footer { background: #1e1b2e; color: #c4b5fd; }
        footer a { color: #e9d5ff; }
    </style>
</head>
<body>
{% include 'partials/navbar.html' %}

<main class="container py-4">
    {% include 'partials/messages.html' %}
    {% block content %}{% endblock %}
</main>

{% include 'partials/footer.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
